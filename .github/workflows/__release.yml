---
name: Internal - Release

on: # yamllint disable-line rule:truthy
  workflow_dispatch:

  schedule:
    - cron: "25 8 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    uses: ./.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: write
      deployments: write
      id-token: write
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

  release:
    name: Create and publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the app token so publishing the tag triggers the main CI documentation jobs.
      - id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env] CI bot authentication is required to trigger tag workflows
          permission-contents: write
          permission-pull-requests: read

      - name: Plan release
        id: plan-release
        uses: ./actions/release/plan
        with:
          target-sha: ${{ github.sha }}
          github-token: ${{ steps.generate-token.outputs.token }}

      - name: Create and publish release
        if: steps.plan-release.outputs.has-changes == 'true'
        uses: ./actions/release/create
        with:
          tag: ${{ steps.plan-release.outputs.tag }}
          target-sha: ${{ github.sha }}
          publish: "true"
          changelog-summary:
            | # zizmor: ignore[secrets-outside-env] summary configuration includes the LLM provider credential
            {
              "llmAuth": ${{ toJSON(secrets.OPENAI_API_KEY) }},
              "llmProvider": "openai"
            }
          github-token: ${{ steps.generate-token.outputs.token }}
