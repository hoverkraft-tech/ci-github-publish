---
name: Internal - Common Continuous Integration tasks

on: # yamllint disable-line rule:truthy
  workflow_call:
    secrets:
      CI_BOT_APP_PRIVATE_KEY:
        description: "Private key of the CI Bot GitHub App used for authentication in tests that require it."
        required: true

permissions: {}

jobs:
  test-action-distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/test-action-distributions.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      contents: read

  test-action-release-verify:
    uses: $/.github/workflows/__test-action-release-verify.yml
    permissions:
      actions: read
      contents: read

  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
      security-events: write
      statuses: write
    with:
      comment: false

  test-action-check-url-lighthouse:
    needs: lint
    uses: $/.github/workflows/__test-action-check-url-lighthouse.yml
    permissions:
      contents: read

  test-action-check-url-ping:
    needs: lint
    uses: $/.github/workflows/__test-action-check-url-ping.yml
    permissions:
      contents: read

  test-action-deploy-argocd-manifest-files:
    needs: lint
    uses: $/.github/workflows/__test-action-deploy-argocd-manifest-files.yml
    permissions:
      contents: read

  test-action-deploy-jekyll-jampack:
    needs: lint
    uses: $/.github/workflows/__test-action-deploy-jekyll-jampack.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-deployment:
    needs: lint
    uses: $/.github/workflows/__test-action-deployment.yml
    secrets:
      CI_BOT_APP_PRIVATE_KEY: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
    permissions:
      contents: read
      deployments: write
      pull-requests: read

  test-action-release-get-configuration:
    needs: lint
    uses: $/.github/workflows/__test-action-release-get-configuration.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-release-create:
    needs: lint
    uses: $/.github/workflows/__test-action-release-create.yml
    permissions:
      contents: write
      pull-requests: read

  test-action-release-delete:
    needs: [lint, test-action-release-create]
    uses: $/.github/workflows/__test-action-release-delete.yml
    permissions:
      contents: write
      pull-requests: read

  test-action-release-prepare-and-plan:
    needs: lint
    uses: $/.github/workflows/__test-action-release-prepare-and-plan.yml
    permissions:
      contents: write
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  test-action-release-summarize-changelog:
    needs: lint
    uses: $/.github/workflows/__test-action-release-summarize-changelog.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write

  reports:
    needs:
      - lint
      - test-action-deploy-jekyll-jampack
      - test-action-release-get-configuration
      - test-action-release-prepare-and-plan
      - test-action-release-summarize-changelog
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}
