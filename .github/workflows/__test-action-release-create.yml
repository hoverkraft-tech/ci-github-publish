name: Internal - Tests for "release/create" action

on:
  workflow_call:

permissions: {}

jobs:
  tests:
    name: Tests for "release/create" action
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Arrange - Build test release inputs
        id: test-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = `test-release-create-${context.runId}-${context.runAttempt}`;
            core.setOutput('tag', tag);

      - name: Act - Create explicit draft release
        id: create-release
        uses: $/actions/release/create
        with:
          tag: ${{ steps.test-release.outputs.tag }}
          target-ref: ${{ github.sha }}
          config-overrides: |
            name-template: Configured release
          prerelease: "true"
          publish: "false"
          github-token: ${{ github.token }}

      - name: Assert - Created draft release
        id: draft-release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CREATED_TAG: ${{ steps.test-release.outputs.tag }}
          OUTPUT_TAG: ${{ steps.create-release.outputs.tag }}
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const assert = require('node:assert');
            // jscpd:ignore-start
            const wait = (delayMs) => new Promise((resolve) => setTimeout(resolve, delayMs));

            const findReleaseByTag = async (tag) => {
              const attempts = 5;

              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag,
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }

                  const releases = await github.paginate(github.rest.repos.listReleases, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 100,
                  });

                  const matchingRelease = releases.find((release) => (release.tag_name || '').trim() === tag);
                  if (matchingRelease) {
                    return { data: matchingRelease };
                  }

                  if (attempt === attempts) {
                    throw error;
                  }

                  await wait(attempt * 1000);
                }
              }
            };

            // jscpd:ignore-end

            const createdTag = (process.env.CREATED_TAG || '').trim();
            const outputTag = (process.env.OUTPUT_TAG || '').trim();
            const expectedReleaseSha = (process.env.EXPECTED_RELEASE_SHA || '').trim();

            assert.equal(outputTag, createdTag);

            const releaseResponse = await findReleaseByTag(createdTag);
            core.setOutput('release-id', String(releaseResponse.data.id));

            assert.equal(releaseResponse.data.tag_name, createdTag);
            assert.equal(releaseResponse.data.name, 'Configured release');
            assert.equal(releaseResponse.data.draft, true);
            assert.equal(releaseResponse.data.prerelease, true);
            assert.equal(releaseResponse.data.target_commitish, expectedReleaseSha);
            assert.match(releaseResponse.data.body, /^## What's Changed\n\n/);
            assert.match(releaseResponse.data.body, /\n## New Contributors\n\n/);

      - name: Act - Update draft release body
        uses: $/actions/release/update
        with:
          tag: ${{ steps.test-release.outputs.tag }}
          body: "Release notes updated before publication."
          github-token: ${{ github.token }}

      - name: Assert - Updated draft preserves its tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.draft-release.outputs.release-id }}
          EXPECTED_TAG: ${{ steps.test-release.outputs.tag }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const { data: release } = await github.rest.repos.getRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
            });

            assert.equal(release.tag_name, process.env.EXPECTED_TAG);
            assert.equal(release.draft, true);
            assert.equal(release.body, 'Release notes updated before publication.');

      - name: Arrange - Create release asset without Git metadata
        id: release-asset
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const assetPath = path.join(process.env.RUNNER_TEMP, 'release-test.txt');
            await fs.writeFile(assetPath, 'Release asset uploaded without a checkout.\n');
            await io.rmRF(path.join(process.env.GITHUB_WORKSPACE, '.git'));
            core.setOutput('path', assetPath);

      - name: Arrange - Upload release artifact
        id: release-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-update-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.release-asset.outputs.path }}
          if-no-files-found: error

      - name: Act - Upload asset and publish release without a checkout
        uses: $/actions/release/update
        with:
          tag: ${{ steps.test-release.outputs.tag }}
          release-artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
          publish: "true"
          github-token: ${{ github.token }}

      - name: Assert - Published release, asset and Git tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.draft-release.outputs.release-id }}
          EXPECTED_TAG: ${{ steps.test-release.outputs.tag }}
          EXPECTED_SHA: ${{ github.sha }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const { createHash } = require('node:crypto');
            const tag = process.env.EXPECTED_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo,
              tag,
            });
            const { data: tagRef } = await github.rest.git.getRef({
              ...context.repo,
              ref: `tags/${tag}`,
            });

            assert.equal(release.id, Number(process.env.RELEASE_ID));
            assert.equal(release.tag_name, tag);
            assert.equal(release.draft, false);
            assert.equal(release.prerelease, true);
            assert.equal(release.body, 'Release notes updated before publication.');
            assert.equal(tagRef.object.sha, process.env.EXPECTED_SHA);
            assert.equal(release.assets.length, 1);
            assert.equal(release.assets[0].name, 'release-test.txt');
            const expectedContent = 'Release asset uploaded without a checkout.\n';
            assert.equal(release.assets[0].size, Buffer.byteLength(expectedContent));
            assert.equal(release.assets[0].digest, `sha256:${createHash('sha256').update(expectedContent).digest('hex')}`);

      - name: Cleanup - Delete test release and tag
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CREATED_TAG: ${{ steps.test-release.outputs.tag }}
          RELEASE_ID: ${{ steps.draft-release.outputs.release-id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = (process.env.CREATED_TAG || '').trim();
            if (!tag) {
              return;
            }

            // jscpd:ignore-start
            const wait = (delayMs) => new Promise((resolve) => setTimeout(resolve, delayMs));

            const findReleaseByTag = async (releaseTag) => {
              const attempts = 5;

              for (let attempt = 1; attempt <= attempts; attempt += 1) {
                try {
                  return await github.rest.repos.getReleaseByTag({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    tag: releaseTag,
                  });
                } catch (error) {
                  if (error.status !== 404) {
                    throw error;
                  }

                  const releases = await github.paginate(github.rest.repos.listReleases, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    per_page: 100,
                  });

                  const matchingRelease = releases.find((release) => (release.tag_name || '').trim() === releaseTag);
                  if (matchingRelease) {
                    return { data: matchingRelease };
                  }

                  if (attempt === attempts) {
                    return null;
                  }

                  await wait(attempt * 1000);
                }
              }
            };

            // jscpd:ignore-end

            const releaseId = Number(process.env.RELEASE_ID || 0);
            const release = releaseId
              ? await github.rest.repos.getRelease({ ...context.repo, release_id: releaseId })
              : await findReleaseByTag(tag);
            if (release) {
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
              });
            }

            const tags = new Set([tag, release?.data.tag_name].filter(Boolean));
            for (const releaseTag of tags) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${releaseTag}`,
                });
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  continue;
                }

                throw error;
              }
            }
