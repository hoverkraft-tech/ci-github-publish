name: Internal - Tests for "release/prepare" and "release/plan" actions

on:
  workflow_call:

permissions: {}

jobs:
  continuous-integration:
    name: Continuous integration for "release/${{ matrix.action }}" action
    strategy:
      matrix:
        action: [prepare, plan]
    uses: hoverkraft-tech/ci-github-nodejs/.github/workflows/continuous-integration.yml@97f64bc080b78daca8fb3ece49de448aaac83429 # 1.1.0
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
    with:
      working-directory: ./actions/release/${{ matrix.action }}
      build: null
      lint: null
      test: '{ "coverage": null }'

  tests:
    name: Tests for "release/plan" action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Act - Plan drafter release
        id: drafter-plan
        uses: $/actions/release/plan
        with:
          working-directory: actions/release/get-configuration

      - name: Assert - Drafter release plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.drafter-plan.outputs.tag }}
          RELEASE_NAME: ${{ steps.drafter-plan.outputs.name }}
          SHOULD_RELEASE: ${{ steps.drafter-plan.outputs.should-release }}
        with:
          script: |
            const assert = require('node:assert');

            assert.ok(['true', 'false'].includes(process.env.SHOULD_RELEASE), 'Expected a boolean should-release output');
            assert.ok(process.env.RELEASE_TAG, 'Expected planned tag to be set');
            assert.ok(process.env.RELEASE_TAG.startsWith('get-configuration-'), `Expected tag to start with "get-configuration-", got "${process.env.RELEASE_TAG}"`);
            assert.ok(process.env.RELEASE_NAME, 'Expected planned name to be set');
            assert.ok(process.env.RELEASE_NAME.startsWith('Version get-configuration - '), `Expected name to start with "Version get-configuration - ", got "${process.env.RELEASE_NAME}"`);

      - name: Act - Plan with generic configuration overrides
        id: configured-plan
        uses: $/actions/release/plan
        with:
          working-directory: actions/release/get-configuration
          config-overrides: &plan-configuration |
            tag-prefix: configured-
            tag-template: configured-$RESOLVED_VERSION-final
            name-template: Configured $RESOLVED_VERSION / protocol 1.0.0
            version-template: $MAJOR.$MINOR

      - name: Assert - Configured release identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.configured-plan.outputs.tag }}
          RELEASE_NAME: ${{ steps.configured-plan.outputs.name }}
          SHOULD_RELEASE: ${{ steps.configured-plan.outputs.should-release }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.match(process.env.RELEASE_TAG, /^configured-\d+\.\d+-final$/);
            assert.match(process.env.RELEASE_NAME, /^Configured \d+\.\d+ \/ protocol 1\.0\.0$/);
            assert.ok(['true', 'false'].includes(process.env.SHOULD_RELEASE));

      - name: Act - Force a read-only release plan
        id: forced-plan
        uses: $/actions/release/plan
        with:
          working-directory: actions/release/get-configuration
          force: "true"
          config-overrides: *plan-configuration
      - name: Assert - Forced plan preserves the configured identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SHOULD_RELEASE: ${{ steps.forced-plan.outputs.should-release }}
          RELEASE_TAG: ${{ steps.forced-plan.outputs.tag }}
          RELEASE_NAME: ${{ steps.forced-plan.outputs.name }}
          EXPECTED_TAG: ${{ steps.configured-plan.outputs.tag }}
          EXPECTED_NAME: ${{ steps.configured-plan.outputs.name }}
        with:
          script: |
            const assert = require('node:assert/strict');
            assert.equal(process.env.SHOULD_RELEASE, 'true');
            assert.equal(process.env.RELEASE_TAG, process.env.EXPECTED_TAG);
            assert.equal(process.env.RELEASE_NAME, process.env.EXPECTED_NAME);
