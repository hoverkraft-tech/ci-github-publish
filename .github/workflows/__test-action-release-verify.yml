name: Internal - Test release source verification
on:
  workflow_call:
permissions: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test artifact identity, tag conflicts and release recovery
        run: node --test actions/release/verify/index.test.js
      - name: Arrange - Source artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions/release/verify/action.yml
          if-no-files-found: error
      - name: Act - Verify workflow artifact identity without creating a tag
        id: verify
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        uses: $/actions/release/verify
        with:
          artifact-ids: '["${{ steps.artifact.outputs.artifact-id }}"]'
          tags: '["verify-${{ github.run_id }}-${{ github.run_attempt }}"]'
      - name: Assert - Release identity follows the workflow source commit
        env:
          RELEASES: ${{ steps.verify.outputs.releases }}
          OUTCOME: ${{ steps.verify.outcome }}
          EXPECT_MISMATCH: ${{ github.event_name == 'pull_request' && github.sha != github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          // PR artifacts identify the head commit, while github.sha identifies the test merge.
          if (process.env.EXPECT_MISMATCH === 'true') assert.equal(process.env.OUTCOME, 'failure');
          else {
            assert.equal(process.env.OUTCOME, 'success');
            assert.equal(JSON.parse(process.env.RELEASES)[0].published, false);
          }
          NODE
      - name: Act - Require a missing prepared tag
        if: github.event_name != 'pull_request'
        id: missing-tag
        continue-on-error: true
        uses: $/actions/release/verify
        with:
          artifact-ids: '["${{ steps.artifact.outputs.artifact-id }}"]'
          tags: '["verify-${{ github.run_id }}-${{ github.run_attempt }}"]'
          require-tags: "true"
      - name: Assert - Missing tag fails verification
        if: github.event_name != 'pull_request'
        env:
          OUTCOME: ${{ steps.missing-tag.outcome }}
        run: test "$OUTCOME" = failure
