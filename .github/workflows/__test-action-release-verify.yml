name: Internal - Test release source verification
on:
  workflow_call:
permissions: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test artifact identity, tag conflicts and release recovery
        run: node --test actions/release/verify/index.test.js
      - name: Arrange - Source artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: actions/release/verify/action.yml
          if-no-files-found: error
      - name: Verify uploaded artifact identity and reject a different source commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          TAG: verify-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const { ReleaseVerification } = require('./actions/release/verify/index.js');
            // PR artifacts identify the head commit, while context.sha identifies the test merge.
            const sourceSha = context.payload.pull_request?.head.sha ?? context.sha;
            const sourceContext = { repo: context.repo, runId: context.runId, sha: sourceSha };
            const inputs = { artifactIds: [process.env.ARTIFACT_ID], tags: [process.env.TAG] };
            const verification = new ReleaseVerification({ github, context: sourceContext });
            assert.deepEqual(await verification.verify(inputs), [{ tag: process.env.TAG, published: false }]);

            const otherSource = new ReleaseVerification({ github, context: { ...sourceContext, sha: '0'.repeat(40) } });
            await assert.rejects(otherSource.verify(inputs), {
              message: 'Release artifacts must be unexpired and belong to this run and commit.',
            });
      - name: Act - Verify source-only release without artifacts
        id: source
        uses: $/actions/release/verify
        with:
          tags: '["verify-${{ github.run_id }}-${{ github.run_attempt }}"]'
      - name: Assert - Source-only release is ready
        env:
          RELEASES: ${{ steps.source.outputs.releases }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          assert.equal(JSON.parse(process.env.RELEASES)[0].published, false);
          NODE
      - name: Act - Require a missing source tag
        id: missing-tag
        continue-on-error: true
        uses: $/actions/release/verify
        with:
          tags: '["verify-${{ github.run_id }}-${{ github.run_attempt }}"]'
          require-tags: "true"
      - name: Assert - Missing tag fails verification
        env:
          OUTCOME: ${{ steps.missing-tag.outcome }}
        run: test "$OUTCOME" = failure
