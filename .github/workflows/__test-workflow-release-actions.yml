---
name: Test for "release-actions" workflow

on: # yamllint disable-line rule:truthy
  workflow_call:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test documentation publication conditions
        run: node --test tests/release-actions.test.cjs
