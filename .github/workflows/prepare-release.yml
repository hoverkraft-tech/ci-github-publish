# Reusable workflow that performs release preparation tasks:
#
# - Add proper labels to pull requests

name: Prepare release

on:
  workflow_call:
    inputs:
      runs-on:
        description: |
          JSON array of runner(s) to use.
          See https://docs.github.com/en/actions/using-jobs/choosing-the-runner-for-a-job.
        type: string
        default: '["ubuntu-latest"]'
        required: false
      working-directory:
        description: |
          Working directory used to scope release preparation in a monorepo.
          If specified, the workflow looks for `.github/release-configs/{slug}.yml`, where `slug` is derived from the working directory basename.
          If that file does not exist, a temporary release configuration is generated with `include-paths` for the working directory and current workflow file.
          The generated defaults follow Conventional Commits and Semantic Versioning: breaking changes increment major, `feat` increments minor, and all other changes increment patch.
          They also apply Conventional Commit labels.
          They credit co-authors and highlight new contributors, with an explicit empty state when there are none.
        type: string
        required: false
        default: ""
    secrets:
      github-token:
        description: |
          GitHub token with following permissions:

          - `contents: read`
          - `pull-requests: write`

concurrency:
  group: ${{ github.workflow }}-${{ inputs.working-directory }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  prepare:
    runs-on: ${{ fromJson(inputs.runs-on) }}
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: local-workflow-actions
        uses: hoverkraft-tech/ci-github-common/actions/local-workflow-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
        with:
          actions-path: actions

      - id: get-configuration
        uses: ./../self-workflow/actions/release/get-configuration
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Ensure default release labels exist
        if: github.event_name == 'pull_request' && steps.get-configuration.outputs.is-generated == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.github-token || secrets.GITHUB_TOKEN || github.token }} # zizmor: ignore[secrets-outside-env] reusable workflow token override is intentional
          script: |
            const labels = [
              { name: 'type: breaking', color: 'b60205', description: 'Introduces a breaking change' },
              { name: 'type: feature', color: 'a2eeef', description: 'Introduces a new feature' },
              { name: 'type: dependencies', color: '0366d6', description: 'Updates dependencies' },
              { name: 'type: fix', color: 'd73a4a', description: 'Fixes a bug' },
              { name: 'type: performance', color: '5319e7', description: 'Improves performance' },
              { name: 'type: documentation', color: '0075ca', description: 'Updates documentation' },
              { name: 'type: maintenance', color: 'ededed', description: 'Performs maintenance work' },
            ];

            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo,
              per_page: 100,
            });
            const existingNames = new Set(existingLabels.map(({ name }) => name.toLowerCase()));

            for (const label of labels) {
              if (existingNames.has(label.name.toLowerCase())) {
                continue;
              }

              try {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              } catch (error) {
                if (error.status !== 422) {
                  throw error;
                }

                // Another concurrent workflow may have created the label after it was listed.
                await github.rest.issues.getLabel({ ...context.repo, name: label.name });
              }
            }

      - uses: release-drafter/release-drafter/autolabeler@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.github-token || secrets.GITHUB_TOKEN || github.token }} # zizmor: ignore[secrets-outside-env] reusable workflow token override is intentional
          # config-path is relative to ".github" directory
          config-name: file:${{ steps.get-configuration.outputs.config-path }}
