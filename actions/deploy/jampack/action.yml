name: "Jampack"
description: "Action to run Jampack post-processing tool on given static assets."
author: Hoverkraft
branding:
  icon: package
  color: blue

inputs:
  path:
    description: "Path of the directory containing the static assets."
    required: true
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: hoverkraft-tech/ci-github-nodejs/actions/setup-node@97f64bc080b78daca8fb3ece49de448aaac83429 # 1.1.0
      with:
        working-directory: ${{ github.action_path }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: "${{ runner.temp }}/.jampack"
        key: ${{ runner.os }}-jampack-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-jampack-

    - shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        JAMPACK_CACHE_FOLDER: "${{ runner.temp }}/.jampack/cache"
        INPUT_PATH: ${{ inputs.path }}
      run: |
        # Create a cache directory for Jampack
        mkdir -p "${JAMPACK_CACHE_FOLDER}"

        # Run Jampack on the specified path
        "${ACTION_PATH}/node_modules/.bin/jampack" --cache_folder "${JAMPACK_CACHE_FOLDER}" -- "${INPUT_PATH}"

        # Clean up the Jampack cache directory
        rm -rf "${INPUT_PATH}/_jampack"
