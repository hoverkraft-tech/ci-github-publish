name: "Release - Get Configuration"
description: "Action to get the release configuration details"
author: hoverkraft
branding:
  icon: bookmark
  color: blue

inputs:
  config-overrides:
    description: |
      Optional partial Release Drafter configuration as a YAML or JSON mapping.
      Precedence: generated defaults, repository configuration, then these overrides.
      Supplied mappings and lists replace inherited values. Categories preserve inherited pre-include filters unless they contain an explicit pre-include category; an empty categories list clears changelog and version rules but keeps the scope.
      Repository files with their own _extends chain use native Release Drafter inheritance instead of generated defaults and scope preservation.
      The _extends key is reserved in this input. Pass identical overrides to release/plan and release/create.
      See [release configuration](../../../docs/usage/release.md#override-release-configuration) for scope examples.
    default: ""
  working-directory:
    description: |
      Working directory used to scope release automation in a monorepo.
      If specified, the action looks for `.github/release-configs/{slug}.yml`, where `slug` is derived from the working directory basename.
      Repository configuration files override generated defaults unless they explicitly declare their own _extends chain. Generated defaults scope changes to the working directory with a `pre-include` category.
      The generated defaults follow Conventional Commits and Semantic Versioning: breaking changes increment major, `feat` increments minor, and all other changes increment patch.
      They also define Conventional Commit labels.
      They credit co-authors and highlight new contributors, with an explicit empty state when there are none.
    required: false
    default: ""
  additional-paths:
    description: |
      Additional paths to include in generated release notes and version calculation (JSON array).
      These paths are added to the working-directory scope when one is specified.
      Add the calling workflow path explicitly to include workflow-only changes.
      To replace this scope, supply categories in the repository configuration or config-overrides input with a `type: pre-include` entry using `when.paths`, plus the desired changelog and version rules.
    required: false
    default: "[]"

outputs:
  config-path:
    description: "The effective configuration path relative to the .github directory"
    value: ${{ steps.override-config.outputs.config-path || steps.create-temp-config.outputs.config-path }}
  is-generated:
    description: "Whether the effective configuration is temporary. False when a repository configuration with its own inheritance is used without input overrides."
    value: ${{ steps.override-config.outputs.is-generated || 'true' }}

runs:
  using: "composite"
  steps:
    - id: resolve-config-paths
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
          const githubDirectory = path.join(workspace, '.github');
          const gitDirectory = path.join(workspace, '.git');
          const runnerTemp = process.env.RUNNER_TEMP || path.join(workspace, '.runner-temp');
          let workingDirectory = (process.env.WORKING_DIRECTORY || '').trim();
          let repositoryConfigPath = 'release-config.yml';
          let configSlug = '';

          if (workingDirectory) {
            const workingDirectoryFullPath = path.isAbsolute(workingDirectory)
              ? workingDirectory
              : path.join(workspace, workingDirectory);

            workingDirectory = path.relative(workspace, workingDirectoryFullPath);
            configSlug = path.basename(workingDirectoryFullPath)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');

            repositoryConfigPath = `release-configs/${configSlug}.yml`;
          }

          const tempDirectory = path.join(runnerTemp, 'release-drafter');
          const tempConfigPath = path.join(tempDirectory, path.basename(repositoryConfigPath));
          const tempConfigRelativePath = path.relative(githubDirectory, tempConfigPath).split(path.sep).join('/');
          const repositoryConfigFullPath = path.join(githubDirectory, repositoryConfigPath);

          core.setOutput('requires-checkout', fs.existsSync(gitDirectory) ? 'false' : 'true');
          core.setOutput('working-directory', workingDirectory);
          core.setOutput('config-slug', configSlug);
          core.setOutput('repository-config-path', repositoryConfigPath);
          core.setOutput('repository-config-full-path', repositoryConfigFullPath);
          core.setOutput('temp-config-path', tempConfigRelativePath);

    - if: steps.resolve-config-paths.outputs.requires-checkout == 'true'
      uses: hoverkraft-tech/ci-github-common/actions/checkout@66882b24f9f13e45a6541896a5a7c638cb91c94c # 4.0.0
      with:
        fetch-depth: "1"
        sparse-checkout: .github/${{ steps.resolve-config-paths.outputs.repository-config-path }}

    - id: local-config
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPOSITORY_CONFIG_PATH: ${{ steps.resolve-config-paths.outputs.repository-config-path }}
        REPOSITORY_CONFIG_FULL_PATH: ${{ steps.resolve-config-paths.outputs.repository-config-full-path }}
      with:
        script: |
          const fs = require('node:fs');

          const configRelativePath = process.env.REPOSITORY_CONFIG_PATH || 'release-config.yml';
          const repositoryConfigPath = process.env.REPOSITORY_CONFIG_FULL_PATH || '';

          const configExists = fs.existsSync(repositoryConfigPath);

          if (configExists) {
            core.debug(`Using repository config path: ${configRelativePath}`);
            core.setOutput('config-path', configRelativePath);
            return;
          }

    - id: create-temp-config
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CONFIG_SLUG: ${{ steps.resolve-config-paths.outputs.config-slug }}
        ADDITIONAL_PATHS: ${{ inputs.additional-paths }}
        CONFIG_PATH: ${{ steps.resolve-config-paths.outputs.temp-config-path }}
        WORKING_DIRECTORY: ${{ steps.resolve-config-paths.outputs.working-directory }}
      with:
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          let configPath = process.env.CONFIG_PATH;
          const configSlug = process.env.CONFIG_SLUG || '';
          const workingDirectory = process.env.WORKING_DIRECTORY || '';
          const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
          const githubDirectory = path.join(workspace, '.github');

          if (!configPath) {
            return core.setFailed('Configuration path is not specified.');
          }
          configPath = path.join(githubDirectory, configPath);

          const includePaths = new Set();
          try {
            const additionalPathsInput = JSON.parse(process.env.ADDITIONAL_PATHS || '[]');
            if (!Array.isArray(additionalPathsInput)) {
              return core.setFailed('additional-paths input is not an array');
            }

            for (const includePath of additionalPathsInput) {
              if (typeof includePath !== 'string') {
                return core.setFailed('additional-paths input must be an array of strings');
              }

              const trimmedPath = includePath.trim();
              if (trimmedPath.length === 0) {
                continue;
              }

              includePaths.add(trimmedPath);
            }
          } catch (error) {
            return core.setFailed(`Failed to parse additional-paths input: ${error.message}`);
          }

          if (workingDirectory) {
            includePaths.add(workingDirectory);
          }

          core.debug(`Resolved include paths: ${JSON.stringify(Array.from(includePaths))}`);

          const scopeCategory = includePaths.size > 0
            ? [
                '  - type: pre-include',
                '    when:',
                '      paths:',
                ...Array.from(includePaths, includePath => `        - ${JSON.stringify(includePath)}`),
              ]
            : [];

          const nameTemplate = workingDirectory
            ? `Version ${configSlug} - \$RESOLVED_VERSION`
            : 'Version \$RESOLVED_VERSION';

          const tagPrefix = workingDirectory
            ? `${configSlug}-`
            : '';

          const tagTemplate = `${tagPrefix}\$RESOLVED_VERSION`;

          const configContent = [
            '---',
            'template: |',
            '  ## What\'s Changed',
            '',
            '  \$CHANGES',
            '',
            '  ## New Contributors',
            '',
            '  \$NEW_CONTRIBUTORS',
            '',
            '  **Full Changelog**: https://github.com/\$OWNER/\$REPOSITORY/compare/\$PREVIOUS_TAG...\$RESOLVED_TAG',
            `name-template: "${nameTemplate}"`,
            `tag-template: "${tagTemplate}"`,
            `tag-prefix: "${tagPrefix}"`,
            'category-template: "### $TITLE"',
            'prerelease-identifier: "rc"',
            'change-authors-final-separator: " and "',
            'no-new-contributor-template: "_No new contributors in this release._"',
            'autolabeler:',
            '  - label: "type: breaking"',
            '    title:',
            '      - "/^[a-z][a-z0-9-]*(?:\\\\([^)]+\\\\))?!:/i"',
            '  - label: "type: feature"',
            '    title:',
            '      - "/^feat(?:\\\\([^)]+\\\\))?!?:/i"',
            '  - label: "type: dependencies"',
            '    title:',
            '      - "/^[a-z][a-z0-9-]*\\\\(deps(?:-dev)?\\\\)!?:/i"',
            '  - label: "type: fix"',
            '    title:',
            '      - "/^fix(?:\\\\([^)]+\\\\))?!?:/i"',
            '  - label: "type: performance"',
            '    title:',
            '      - "/^perf(?:\\\\([^)]+\\\\))?!?:/i"',
            '  - label: "type: documentation"',
            '    title:',
            '      - "/^docs(?:\\\\([^)]+\\\\))?!?:/i"',
            '  - label: "type: maintenance"',
            '    title:',
            '      - "/^(?:build|chore|ci|refactor|revert|style|test)(?:\\\\([^)]+\\\\))?!?:/i"',
            'categories:',
            ...scopeCategory,
            '  - title: "Breaking Changes"',
            '    semver-increment: major',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        breaking: true',
            '  - title: "Features"',
            '    semver-increment: minor',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        type: "feat"',
            '  - title: "Dependency Updates"',
            '    collapse-after: 3',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        scopes:',
            '          - "deps"',
            '          - "deps-dev"',
            '  - title: "Bug Fixes"',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        type: "fix"',
            '  - title: "Performance"',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        type: "perf"',
            '  - title: "Documentation"',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        type: "docs"',
            '  - title: "Maintenance"',
            '    exclusive: true',
            '    when:',
            '      conventional:',
            '        types:',
            '          - "build"',
            '          - "chore"',
            '          - "ci"',
            '          - "refactor"',
            '          - "revert"',
            '          - "style"',
            '          - "test"',
            '  - title: "Other Changes"',
            '    semver-increment: patch',
            '    exclusive: true',
            '',
          ].join('\n');

          core.debug(`Writing generated config to: ${configPath}:\n${configContent}`);

          fs.mkdirSync(path.dirname(configPath), { recursive: true });
          fs.writeFileSync(configPath, configContent, 'utf8');
          core.setOutput('config-path', process.env.CONFIG_PATH);

    - name: Compose release configuration overrides
      id: override-config
      if: steps.local-config.outputs.config-path != '' || inputs.config-overrides != ''
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_OVERRIDES: ${{ inputs.config-overrides }}
        BASE_CONFIG_PATH: ${{ steps.create-temp-config.outputs.config-path }}
        REPOSITORY_CONFIG_PATH: ${{ steps.local-config.outputs.config-path }}
      with:
        script: |
          const { pathToFileURL } = require('node:url');
          const { run } = await import(pathToFileURL(`${process.env.ACTION_PATH}/dist/index.js`));
          run({
            core,
            inputs: {
              workspace: process.env.GITHUB_WORKSPACE || process.cwd(),
              runnerTemp: process.env.RUNNER_TEMP,
              baseConfigPath: process.env.BASE_CONFIG_PATH,
              repositoryConfigPath: process.env.REPOSITORY_CONFIG_PATH,
              configOverrides: process.env.CONFIG_OVERRIDES,
            },
          });
