name: "Release - Plan"
description: "Detect release changes and plan a release identity without creating a Git tag or GitHub release."
author: hoverkraft
branding:
  icon: bookmark
  color: blue

inputs:
  prerelease:
    description: "Whether to plan the release as a prerelease"
    required: false
    default: "false"
  working-directory:
    description: |
      Working directory used to scope release automation in a monorepo.
      If specified, the action looks for `.github/release-configs/{slug}.yml`, where `slug` is derived from the working directory basename.
      If that file does not exist, a temporary release configuration is generated with `include-paths` for the working directory and current workflow file.
      The generated defaults follow Conventional Commits and Semantic Versioning: breaking changes increment major, `feat` increments minor, and all other changes increment patch.
      They also define Conventional Commit labels.
      They credit co-authors and highlight new contributors, with an explicit empty state when there are none.
    required: false
    default: ""
  include-paths:
    description: |
      Additional paths to include in the release notes filtering (JSON array).
      These paths are added to the `include-paths` configuration of release-drafter.
    required: false
    default: "[]"
  target-sha: # codespell:ignore commitish
    description: |
      Optional branch, commit SHA, fully qualified tag ref, or pull request ref to plan from.
      Forwarded to Release Drafter as `commitish`; tag and pull request refs are resolved to commit SHAs.
    required: false
    default: ""
  github-token:
    description: |
      GitHub Token for planning the release.
      Permissions:
        - contents: read
        - pull-requests: read
    required: false
    default: ${{ github.token }}

outputs:
  has-changes:
    description: "Whether the release has relevant changes, or no previous matching release exists (true or false)"
    value: ${{ steps.release-plan.outputs.has-changes }}
  tag:
    description: "The planned release tag, including when there are no relevant changes"
    value: ${{ steps.release-plan.outputs.tag }}
  name:
    description: "The planned release name, including when there are no relevant changes"
    value: ${{ steps.release-plan.outputs.name }}

runs:
  using: "composite"
  steps:
    - uses: hoverkraft-tech/ci-github-common/actions/checkout@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
      with:
        fetch-depth: "0"

    - id: local-actions
      uses: hoverkraft-tech/ci-github-common/actions/local-actions@3a27d31e9ccefbe9609cc9165017ed100ff34a22 # 0.38.0
      with:
        source-path: ${{ github.action_path }}/..

    - id: get-configuration
      uses: ./../self-actions/get-configuration
      with:
        working-directory: ${{ inputs.working-directory }}
        include-paths: ${{ inputs.include-paths }}

    - id: prepare-change-detection
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_PATH: ${{ steps.get-configuration.outputs.config-path }}
      with:
        script: |
          const { prepareConfiguration } = require(`${process.env.ACTION_PATH}/index.js`);
          const configuration = prepareConfiguration({
            configPath: process.env.CONFIG_PATH,
            workspace: process.env.GITHUB_WORKSPACE,
            runnerTemp: process.env.RUNNER_TEMP,
          });
          core.setOutput('config-path', configuration.configPath);
          core.setOutput('marker', configuration.marker);

    - id: release-drafter
      uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0 # v7.9.0
      with:
        token: ${{ inputs.github-token }}
        dry-run: "true"
        publish: "false"
        # config-path is relative to ".github" directory
        config-name: file:${{ steps.prepare-change-detection.outputs.config-path }}
        commitish: ${{ inputs.target-sha || github.sha }}
        prerelease: ${{ inputs.prerelease }}
        latest: ${{ inputs.prerelease != 'true' && !inputs.working-directory && 'true' || 'false' }}

    - id: release-plan
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLANNED_RELEASE_NAME: ${{ steps.release-drafter.outputs.name }}
        PLANNED_RELEASE_TAG: ${{ steps.release-drafter.outputs.tag_name }}
        PLANNED_RELEASE_BODY: ${{ steps.release-drafter.outputs.body }}
        CHANGE_DETECTION_MARKER: ${{ steps.prepare-change-detection.outputs.marker }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { resolvePlan } = require(`${process.env.ACTION_PATH}/index.js`);
          try {
            const plan = await resolvePlan({
              body: process.env.PLANNED_RELEASE_BODY,
              marker: process.env.CHANGE_DETECTION_MARKER,
              tag: process.env.PLANNED_RELEASE_TAG,
              name: process.env.PLANNED_RELEASE_NAME,
              github,
              repo: context.repo,
            });
            core.info(plan.hasChanges
              ? 'Release planned with relevant changes or no previous release.'
              : 'Release planned without relevant changes.');
            core.setOutput('has-changes', plan.hasChanges ? 'true' : 'false');
            core.setOutput('tag', plan.tag);
            core.setOutput('name', plan.name);
          } catch (error) {
            core.setFailed(error.message);
          }
