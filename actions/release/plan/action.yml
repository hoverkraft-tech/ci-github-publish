name: "Release - Plan"
description: "Detect release changes and plan a release identity without creating a Git tag or GitHub release."
author: hoverkraft
branding:
  icon: bookmark
  color: blue

inputs:
  config-overrides:
    description: |
      Optional partial Release Drafter configuration as a YAML or JSON mapping.
      Precedence: generated defaults, repository configuration, then these overrides.
      Supplied mappings and lists replace inherited values. Categories preserve inherited pre-include filters unless they contain an explicit pre-include category; an empty categories list clears changelog and version rules but keeps the scope.
      Repository files with their own _extends chain use native Release Drafter inheritance instead of generated defaults and scope preservation.
      The _extends key is reserved in this input. Pass identical overrides to release/plan and release/create.
      See [release configuration](../../../docs/usage/release.md#override-release-configuration) for scope examples.
    default: ""
  force:
    description: |
      Plan a release even without relevant changes, using the version, tag and name calculated by Release Drafter.
      Configured version rules and identity templates remain authoritative. Existing tag collisions still fail; tags are never created or moved.
      Callers decide when forcing is allowed, for example only on manual default-branch runs.
    default: "false"
  prerelease:
    description: "Whether to plan the release as a prerelease"
    required: false
    default: "false"
  working-directory:
    description: |
      Working directory used to scope release automation in a monorepo.
      If specified, the action looks for `.github/release-configs/{slug}.yml`, where `slug` is derived from the working directory basename.
      Repository configuration files override generated defaults unless they explicitly declare their own _extends chain. Generated defaults scope changes to the working directory with a `pre-include` category.
      The generated defaults follow Conventional Commits and Semantic Versioning: breaking changes increment major, `feat` increments minor, and all other changes increment patch.
      They also define Conventional Commit labels.
      They credit co-authors and highlight new contributors, with an explicit empty state when there are none.
    required: false
    default: ""
  additional-paths:
    description: |
      Additional paths to include in generated release notes and version calculation (JSON array).
      These paths are added to the working-directory scope when one is specified.
      Add the calling workflow path explicitly to include workflow-only changes.
      To replace this scope, supply categories in the repository configuration or config-overrides input with a `type: pre-include` entry using `when.paths`, plus the desired changelog and version rules.
    required: false
    default: "[]"
  target-ref:
    description: |
      Optional branch, commit SHA, fully qualified tag ref, or pull request ref to plan from.
      Tag and pull request refs are resolved to commit SHAs.
    required: false
    default: ""
  github-token:
    description: |
      GitHub Token for planning the release.
      Permissions:
        - contents: read
        - pull-requests: read
    required: false
    default: ${{ github.token }}

outputs:
  should-release:
    description: "Whether there are relevant changes, no previous matching release, or an explicit force request (true or false)"
    value: ${{ steps.release-plan.outputs.should-release }}
  tag:
    description: "The planned release tag, including when there are no relevant changes"
    value: ${{ steps.release-plan.outputs.tag }}
  name:
    description: "The planned release name, including when there are no relevant changes"
    value: ${{ steps.release-plan.outputs.name }}

runs:
  using: "composite"
  steps:
    - uses: hoverkraft-tech/ci-github-common/actions/checkout@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
      with:
        fetch-depth: "0"
        ref: ${{ inputs.target-ref || github.sha }}

    - id: get-configuration
      uses: $/actions/release/get-configuration
      with:
        config-overrides: ${{ inputs.config-overrides }}
        working-directory: ${{ inputs.working-directory }}
        additional-paths: ${{ inputs.additional-paths }}

    - id: prepare-change-detection
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        CONFIG_PATH: ${{ steps.get-configuration.outputs.config-path }}
      with:
        script: |
          const { prepareConfiguration } = require(`${process.env.ACTION_PATH}/index.js`);
          const configuration = prepareConfiguration({
            configPath: process.env.CONFIG_PATH,
            workspace: process.env.GITHUB_WORKSPACE,
            runnerTemp: process.env.RUNNER_TEMP,
          });
          core.setOutput('config-path', configuration.configPath);
          core.setOutput('marker', configuration.marker);

    - id: prepare-release
      uses: $/actions/release/prepare
      with:
        github-token: ${{ inputs.github-token }}
        dry-run: "true"
        # config-path is relative to ".github" directory
        config-name: file:${{ steps.prepare-change-detection.outputs.config-path }}
        target-ref: ${{ inputs.target-ref || github.sha }}
        prerelease: ${{ inputs.prerelease }}
        latest: ${{ inputs.prerelease != 'true' && !inputs.working-directory && 'true' || 'false' }}

    - id: release-plan
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        PLANNED_RELEASE_NAME: ${{ steps.prepare-release.outputs.name }}
        PLANNED_RELEASE_TAG: ${{ steps.prepare-release.outputs.tag }}
        PLANNED_RELEASE_BODY: ${{ steps.prepare-release.outputs.body }}
        CHANGE_DETECTION_MARKER: ${{ steps.prepare-change-detection.outputs.marker }}
        FORCE: ${{ inputs.force }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const { resolvePlan } = require(`${process.env.ACTION_PATH}/index.js`);
          try {
            if (!["true", "false"].includes(process.env.FORCE)) throw new Error("force must be true or false.");
            const plan = await resolvePlan({
              body: process.env.PLANNED_RELEASE_BODY,
              marker: process.env.CHANGE_DETECTION_MARKER,
              force: process.env.FORCE === "true",
              tag: process.env.PLANNED_RELEASE_TAG,
              name: process.env.PLANNED_RELEASE_NAME,
              github,
              repo: context.repo,
            });
            core.info(plan.shouldRelease
              ? 'Release planned with changes, no previous release, or an explicit force request.'
              : 'Release planned without relevant changes.');
            core.setOutput('should-release', plan.shouldRelease ? 'true' : 'false');
            core.setOutput('tag', plan.tag);
            core.setOutput('name', plan.name);
          } catch (error) {
            core.setFailed(error.message);
          }
